[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # KODA → Syntrix API → Hetzner Ollama (same as MIRA / CoverIQ). Requires FORGED_SERVER_SECRET in Netlify UI.
  KODA_ENABLED = "true"
  KODA_USE_SYNTRIX = "false"
  KODA_USE_GAS_OLLAMA = "false"
  SYNTRIX_API_URL = "https://api.syntrix.solutions"
  OLLAMA_BASE_URL = "https://ollama.syntrix.solutions:11434"
  FORGED_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxBofOqeRnQK1VyIsqsX5yvXx9EmmQ1LZOeRQZG_Y3PWAM4Shc5ARKgNyzFyBXEmEur/exec"
  # OLLAMA_API_KEY — set in Netlify UI (same bearer secret as Render Syntrix / Hetzner nginx)

# Force HTTPS (fixes browser "Not Secure" when cert is valid)
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-DNS-Prefetch-Control = "on"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# Custom domain TLS: Netlify → Domain management → forgedlearn.com → Verify DNS → Provision certificate
